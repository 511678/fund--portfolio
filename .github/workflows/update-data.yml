# 每个交易日 22:30（北京时间）抓取行业配置+净值，push 后也会触发（新基金补数据）
name: update-market-data

on:
  schedule:
    - cron: "30 14 * * 1-5"   # UTC 14:30 = 北京 22:30（净值发布后）
  workflow_dispatch:           # 手动触发入口
  push:
    paths: ["data/funds.json"]

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取数据
        run: python3 scripts/update_data.py

      - name: 提交
        run: |
          git config user.name "fund-bot"
          git config user.email "actions@github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "数据更新 $(date -u +%F)"
            git push
          fi
